{{- if eq (include "clickhouse.dbaas.declarativeRegistration" .) "true" }}
apiVersion: dbaas.netcracker.com/v1
kind: PhysicalDatabase
metadata:
  name: {{ .Release.Name }}-clickhouse-physical-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: nc-dbaas-clickhouse-adapter
    name: {{ .Release.Name }}-clickhouse-physical-db
    {{ include "kubernetes.labels" . | nindent 4 }}
spec:
  operatorNamespace: {{ include "clickhouse.dbaas.operatorNamespace" . | quote }}
  adapterAddress: {{ include "clickhouse.dbaas.adapter.address" . | quote }}
  credentialsSecretRef:
    name: nc-dbaas-adapter-credentials
{{- end }}
