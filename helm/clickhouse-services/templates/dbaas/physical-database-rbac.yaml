{{- if eq (include "clickhouse.dbaas.declarativeRegistration" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dbaas-adapter-credentials-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: nc-dbaas-clickhouse-adapter
    name: {{ .Release.Name }}-dbaas-adapter-credentials-reader
    {{ include "kubernetes.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - nc-dbaas-adapter-credentials
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dbaas-adapter-credentials-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: nc-dbaas-clickhouse-adapter
    name: {{ .Release.Name }}-dbaas-adapter-credentials-reader
    {{ include "kubernetes.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-dbaas-adapter-credentials-reader
subjects:
  - kind: ServiceAccount
    name: dbaas-operator
    namespace: {{ include "clickhouse.dbaas.operatorNamespace" . | quote }}
{{- end }}
