{{- $pvc := default dict .Values.pvc -}}
{{- $meta := default dict $pvc.metadata -}}
{{- $annotations := default dict $meta.annotations -}}
{{- $desiredCustom := keys $annotations | sortAlpha | join "," -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "pvc-annotations-cleanup-%s" (lower (randAlphaNum 5)) }}
  labels:
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | nindent 4 }}
{{- end }}
{{ include "kubernetes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded, hook-failed
spec:
  template:
    metadata:
      name: "pvc-annotations-cleanup"
      labels:
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | nindent 8 }}
{{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: pvc-cleanup-sa
      {{- if .Values.pvcAnnotationsCleanup.affinity }}
      affinity: {{ .Values.pvcAnnotationsCleanup.affinity | toJson }}
      {{- else if .Values.affinity }}
      affinity: {{ .Values.affinity | toJson }}
      {{- end }}
      containers:
      - name: pvc-annotations-cleanup
        image: {{ template "clickhouse_pvc_cleanup.image" . }}
        imagePullPolicy: Always
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DESIRED_CUSTOM_ANNOTATIONS
          value: {{ $desiredCustom | quote }}
        securityContext:
            {{- include "clickhouse.globalContainerSecurityContext" . | nindent 12 }}
            {{- with .Values.pvcAnnotationsCleanup.securityContext.container }}
            {{- toYaml . | nindent 12 -}}
            {{- end }}
        resources:
          requests:
            memory: {{ default "64Mi" .Values.pvcAnnotationsCleanup.resources.requests.memory }}
            cpu: {{ default "100m" .Values.pvcAnnotationsCleanup.resources.requests.cpu }}
          limits:
            memory: {{ default "128Mi" .Values.pvcAnnotationsCleanup.resources.limits.memory }}
            cpu: {{ default "200m" .Values.pvcAnnotationsCleanup.resources.limits.cpu }}
      securityContext:
        {{ (include "clickhouse.globalPodSecurityContext" . | nindent 8) }}
        {{- with .Values.pvcAnnotationsCleanup.securityContext.pod }}
        {{- toYaml . | nindent 8 -}}
        {{- end }}
