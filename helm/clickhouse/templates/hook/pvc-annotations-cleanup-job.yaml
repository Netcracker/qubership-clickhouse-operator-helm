apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "pvc-annotations-cleanup-%s" (lower (randAlphaNum 5)) }}
  labels:
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | nindent 4 }}
{{- end }}
{{ include "kubernetes.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded, hook-failed
spec:
  template:
    metadata:
      name: "pvc-annotations-cleanup"
      labels:
{{- if .Values.podLabels }}
{{ .Values.podLabels | toYaml | nindent 8 }}
{{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: post-hook-sa
      {{- if .Values.postHook.affinity }}
      affinity: {{ .Values.postHook.affinity | toJson }}
      {{- else if .Values.affinity }}
      affinity: {{ .Values.affinity | toJson }}
      {{- end }}
      containers:
      - name: pvc-annotations-cleanup
        image: {{ template "clickhouse_pvc_cleanup.image" . }}
        imagePullPolicy: Always
        env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: DESIRED_CUSTOM_ANNOTATIONS
            value: {{ $pvc := default dict .Values.pvc }}{{ $meta := default dict $pvc.metadata }}{{ $annotations := default dict $meta.annotations }}{{ keys $annotations | sortAlpha | join "," | quote }}
        securityContext:
            {{- include "clickhouse.globalContainerSecurityContext" . | nindent 12 }}
            {{- with .Values.postHook.securityContext.container }}
            {{- toYaml . | nindent 12 -}}
            {{- end }}
        resources:
          requests:
            memory: {{ default "64Mi" .Values.postHook.resources.requests.memory }}
            cpu: {{ default "100m" .Values.postHook.resources.requests.cpu }}
          limits:
            memory: {{ default "128Mi" .Values.postHook.resources.limits.memory }}
            cpu: {{ default "200m" .Values.postHook.resources.limits.cpu }}
      securityContext:
        {{ (include "clickhouse.globalPodSecurityContext" . | nindent 8) }}
        {{- with .Values.postHook.securityContext.pod }}
        {{- toYaml . | nindent 8 -}}
        {{- end }}
