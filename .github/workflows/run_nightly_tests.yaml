name: Run Nightly Clickhouse Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  push
#  schedule:
#    - cron: '0 1 * * *'

jobs:
  Nightly-Clickhouse-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/clickhouse.yaml@feat/clickhouse # v1.17.0
    with:
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: 'feat/clickhouse' # v1.17.0 renovate: depName=Netcracker/qubership-test-pipelines
      runner_type: 'ubuntu-latest'
      scope: nightly
      verify_timeout_minutes: 60
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}

